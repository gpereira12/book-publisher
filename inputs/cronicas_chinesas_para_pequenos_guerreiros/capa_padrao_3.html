<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Capa Horizontal - Padrão 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;900&family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    @page { size: 273.0mm 200.0mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 273.0mm;
      height: 200.0mm;
      background-color: #1c1817;
      color: #1a1a1a;
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    .bleed-left { width: 10.0mm; height: 100%; background: #1c1817; }
    
    .back-cover {
      width: 125.0mm;
      height: 100%;
      padding: 22mm 15mm 15mm 15mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at center, #1c1a1c 0%, #121012 100%);
    }
    .back-title { font-family: 'Cinzel Decorative', 'Cinzel', serif; color: #8c6d1f; font-size: 13pt; letter-spacing: 2px; text-align: center; }
    .gold-divider { width: 40px; height: 1.5px; background: #8c6d1f; margin: 10px auto; }
    .synopsis-box {
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(140, 109, 31, 0.2);
      border-radius: 6px;
      padding: 16px;
      font-size: 9.5pt;
      line-height: 1.6;
      color: #e0e0e0;
      text-align: justify;
    }
    .back-footer { display: flex; flex-direction: row; justify-content: space-between; align-items: center; }
    .publisher-seal img { height: 45px; }
    .barcode-img img { width: 125px; border-radius: 3px; }

    .spine {
      width: 3.0mm;
      height: 100%;
      background: #0d0c0e;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spine-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Cinzel Decorative', 'Cinzel', serif;
      font-size: 8pt;
      font-weight: 700;
      color: #8c6d1f;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .front-cover {
      width: calc(125.0mm + 10.0mm);
      height: 100%;
      position: relative;
      background: #1c1817;
      overflow: hidden;
    }

    /* Estilos do Padrão 1 (Full-Bleed) */
    .pattern-1 .art-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .pattern-1 .overlay-top {
      position: absolute; top: 0; left: 0; width: 100%; height: 45%;
      background: linear-gradient(to bottom, #1c1817 0%, rgba(20,18,20,0.65) 60%, rgba(20,18,20,0) 100%);
      padding: 25.0mm 15mm 0 15mm;
      text-align: center;
    }
    .pattern-1 .front-title { font-family: 'Cinzel Decorative', 'Cinzel', serif; font-size: 20pt; font-weight: 900; color: #8c6d1f; letter-spacing: 2px; }
    .pattern-1 .front-subtitle-italic { font-style: italic; font-size: 9.5pt; color: #5c4a15; margin-top: 8px; }
    .pattern-1 .overlay-bottom {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 25%;
      background: linear-gradient(to top, #1c1817 0%, rgba(20,18,20,0) 100%);
      padding-bottom: 20.0mm;
      display: flex; justify-content: center; align-items: flex-end;
    }

    /* Estilos do Padrão 2 (Split / Tarja Editorial) */
    .pattern-2 { display: flex; flex-direction: column; justify-content: space-between; padding: 20.0mm 0 20.0mm 0; }
    .pattern-2 .split-top-bar { text-align: center; padding: 0 15mm; }
    .pattern-2 .front-title-split { font-family: 'Cinzel Decorative', 'Cinzel', serif; font-size: 18pt; font-weight: 900; color: #8c6d1f; letter-spacing: 2px; }
    .pattern-2 .front-subtitle-split { font-style: italic; font-size: 9.5pt; color: #5c4a15; }
    .pattern-2 .split-image-container { width: 100%; height: 55%; border-top: 2px solid #8c6d1f; border-bottom: 2px solid #8c6d1f; overflow: hidden; }
    .pattern-2 .split-art { width: 100%; height: 100%; object-fit: cover; }
    .pattern-2 .split-bottom-bar { text-align: center; padding: 0 15mm; }

    /* Estilos do Padrão 3 (Moldura / Quadro Oriental) */
    .pattern-3 { display: flex; flex-direction: column; justify-content: space-between; padding: 22.0mm 15mm 22.0mm 15mm; text-align: center; }
    .pattern-3 .framed-header { margin-bottom: 10px; }
    .pattern-3 .front-title { font-family: 'Cinzel Decorative', 'Cinzel', serif; font-size: 18pt; font-weight: 900; color: #8c6d1f; letter-spacing: 2px; }
    .pattern-3 .front-subtitle-italic { font-style: italic; font-size: 9pt; color: #5c4a15; }
    .pattern-3 .gold-frame-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; margin: 10px 0; }
    .pattern-3 .gold-frame-border {
      width: 90%; height: 95%;
      border: 3px double #8c6d1f;
      border-radius: 8px;
      padding: 6px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      overflow: hidden;
      background: #1c191c;
    }
    .pattern-3 .framed-art { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .pattern-3 .framed-footer { margin-top: 10px; }

    .author-name { font-family: 'Montserrat', sans-serif; font-size: 10pt; font-weight: 700; color: #ffffff; letter-spacing: 3.5px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="bleed-left"></div>
  <div class="back-cover">
    <div>
      <div class="back-title">CRÔNICAS CHINESAS PARA PEQUENOS GUERREIROS</div>
      <div class="gold-divider"></div>
      <div class="synopsis-box">Sinopse do livro aqui.</div>
    </div>
    <div class="back-footer">
      <div class="publisher-seal"><img src='file:///Users/gabrielpereira/Desktop/Projetos/Livros/resources/logos/coala/logo.svg'></div>
      <div class="barcode-img"><img src="file:///Users/gabrielpereira/Desktop/Projetos/Livros/inputs/cronicas_chinesas_para_pequenos_guerreiros/assets/isbn_barcode.svg"></div>
    </div>
  </div>
  <div class="spine">
    <div class="spine-text">CRÔNICAS CHINESAS PARA PEQUENOS GUERREIROS • GABRIEL PEREIRA</div>
  </div>

  <!-- Capa Frontal com Padrão Selecionado (1, 2 ou 3) -->
  
    <div class="front-cover pattern-3">
      <div class="framed-header">
        <div class="front-title">CRÔNICAS CHINESAS PARA PEQUENOS GUERREIROS</div>
        <div class="gold-divider"></div>
        <div class="front-subtitle-italic">Histórias Milenares de Coragem, Sabedoria e Autocontrole</div>
      </div>

      <!-- Quadro Ornamental em Ouro -->
      <div class="gold-frame-wrapper">
        <div class="gold-frame-border">
          <img class='framed-art' src='file:///Users/gabrielpereira/Desktop/Projetos/Livros/inputs/cronicas_chinesas_para_pequenos_guerreiros/assets/capa.jpg'>
        </div>
      </div>

      <div class="framed-footer">
        <div class="author-name">GABRIEL PEREIRA</div>
      </div>
    </div>
    
</body>
</html>
